<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Wheels Demo</title>
<style>html,body{margin:0;height:100%;background:#000000}#game{width:100%;height:100%}</style>
<script>window.RufflePlayer=window.RufflePlayer||{};window.RufflePlayer.config={"autoplay":"auto","unmuteOverlay":"visible","letterbox":"on","scaleMode":"showAll","forceScale":true,"backgroundColor":"#000000","splashScreen":true};</script>
<script src="../../ruffle/ruffle.js"></script>
</head>
<body>
<div id="game"></div>
<script>
window.addEventListener('load',function(){
  const ruffle=window.RufflePlayer.newest();
  const player=ruffle.createPlayer();
  player.style.width='100%';player.style.height='100%';
  document.getElementById('game').appendChild(player);
  player.load({url:'happy-wheels-demo.swf'});
});
</script>
</body>
</html>
